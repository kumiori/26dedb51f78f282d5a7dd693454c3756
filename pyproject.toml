[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["takeover"]

[tool.poetry]
package-mode = false

[project]
name = "fotografiska-takeover"
version = "0.1.0"
description = "A Streamlit interface for the TAKE OVER community network."
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "boto3>=1.40,<2",
    "notion-client==3.0.0",
    "plotly>=6.0,<7",
    "PyYAML==6.0.3",
    "streamlit==1.55.0",
    "streamlit-gtag @ git+https://github.com/kumiori/streamlit-gtag.git@7a04ab228f8cb7edac23d1534e7ed8a095a53299",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
