source_kind: open_call
title: Information from the call
paragraphs:
  - >-
    We are looking for works that speak to our time – projects that raise timely or socially relevant questions, offer new perspectives and spark dialogue. We are particularly interested in projects that engage with the world around us and can enter into conversation with Fotografiska’s wider exhibition programme.
  - >-
    The first application round is open until 19 August 2026, the date of World Photography Day. This round seeks works for the autumn 2026 season, when Fotografiska will also present the major exhibition of Vivian Maier. After that, submissions will remain open year-round, with the next available exhibition slot opening in early 2027.
  - >-
    Selected artists will have the opportunity to present their work in one of Fotografiska Tallinn’s most visible and accessible exhibition spaces – our Community Gallery. The exhibition will be supported by the museum’s communications, marketing and public programme activities to help the works reach an audience as wide as possible.
emphasis: PRODUCTION OF THE WORKS IS OUR COLLECTIVE RESPONSIBILITY.
